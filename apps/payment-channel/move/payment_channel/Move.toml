[package]
name = "payment_channel"
edition = "2024"
# Pin framework to the devnet release rev that has verify_bulletproofs_with_dst_ristretto255; see move/Move.toml.
implicit-dependencies = false

[dependencies]
std = { git = "https://github.com/MystenLabs/sui.git", subdir = "crates/sui-framework/packages/move-stdlib", rev = "d034d564f84b901efe507ff8f6e4b5c8c0cb53bd" }
sui = { git = "https://github.com/MystenLabs/sui.git", subdir = "crates/sui-framework/packages/sui-framework", rev = "d034d564f84b901efe507ff8f6e4b5c8c0cb53bd" }
contra = { local = "../../../../move" }
# Pulled in solely so the deploy script can publish bu_token, contra, and
# payment_channel as one bundled package via `sui move build
# --with-unpublished-dependencies`. payment_channel itself does not call
# anything in `bu_token`.
bu_token = { local = "../../../../utils/move/test_token" }

[environments]
devnet = "80d3582e"
