[package]
name = "contra-guardian-enclave"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
contra-guardian-core = { path = "../core" }
fastcrypto.workspace = true
anyhow.workspace = true
bcs.workspace = true
serde.workspace = true
hpke = "0.12"
axum = "0.8"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

# Nitro Secure Module attestation is available only in Linux enclave builds.
[target.'cfg(target_os = "linux")'.dependencies]
nsm_api = { git = "https://github.com/aws/aws-nitro-enclaves-nsm-api.git", rev = "8ec7eac72bbb2097f1058ee32c13e1ff232f13e8", package = "aws-nitro-enclaves-nsm-api" }
serde_bytes = "0.11"

[lib]
name = "contra_guardian_enclave"
path = "src/lib.rs"

[[bin]]
name = "contra-guardian-enclave"
path = "src/main.rs"

[dev-dependencies]
contra-guardian-core = { path = "../core", features = ["test-utils"] }
tower = { version = "0.5", features = ["util"] }
