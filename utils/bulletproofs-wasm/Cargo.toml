[package]
name = "contra-bulletproofs-wasm"
version = "0.1.0"
edition = "2021"
publish = false
description = "WASM bindings for fastcrypto::bulletproofs range proofs"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fastcrypto = { git = "https://github.com/MystenLabs/fastcrypto", rev = "c6010b9080b00e29d039a48c08898d90c2c1cbdd", features = ["wasm"] }
wasm-bindgen = "0.2"
rand = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
